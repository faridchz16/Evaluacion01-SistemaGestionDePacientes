<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Pacientes - Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded shadow-sm">
    <h2 class="text-primary mb-4"> Sistema de Gestión de Pacientes</h2>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold">Buscar Paciente </div>
        <div class="card-body">
            <div class="input-group mb-3">
                <span class="input-group-text">ID del Paciente:</span>
                <input type="number" id="buscarId" class="form-control" value="1">
                <button class="btn btn-primary" onclick="consultarPaciente()">Buscar Paciente</button>
            </div>
            <div id="detallePaciente" class="alert alert-secondary d-none"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-info text-dark fw-bold">Historial de Atenciones </div>
        <div class="card-body">
            <button class="btn btn-outline-info text-dark mb-3" onclick="consultarAtenciones()">Ver Atenciones del Paciente Seleccionado</button>
            <table class="table table-bordered table-striped d-none" id="tablaAtenciones">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Especialidad</th>
                    <th>Médico</th>
                    <th>Motivo</th>
                </tr>
                </thead>
                <tbody id="cuerpoAtenciones"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-success text-white fw-bold">Registrar Nuevo Paciente </div>
        <div class="card-body">
            <form id="formPaciente" onsubmit="registrarPaciente(event)">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Tipo Doc.</label>
                        <select id="tipoDocumento" class="form-select">
                            <option value="DNI">DNI</option>
                            <option value="PASAPORTE">Pasaporte</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">N° Documento</label>
                        <input type="text" id="numeroDocumento" class="form-control" required placeholder="8 dígitos">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombres</label>
                        <input type="text" id="nombres" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Apellido Paterno</label>
                        <input type="text" id="apellidoPaterno" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Apellido Materno</label>
                        <input type="text" id="apellidoMaterno" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha Nacimiento</label>
                        <input type="date" id="fechaNacimiento" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Correo</label>
                        <input type="email" id="correo" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success mt-3">Guardar Paciente</button>
            </form>
            <div id="mensajeRegistro" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8081/api/pacientes";

    async function consultarPaciente() {
      const id = document.getElementById("buscarId").value;
      const box = document.getElementById("detallePaciente");
      try {
        const res = await fetch(`${API_URL}/${id}`);
        if (!res.ok) throw new Error("Paciente no encontrado");
        const data = await res.json();

        box.classList.remove("d-none", "alert-danger");
        box.classList.add("alert-success");
        box.innerHTML = `
          <strong>Paciente:</strong> ${data.nombres} ${data.apellidoPaterno} ${data.apellidoMaterno} <br>
          <strong>${data.tipoDocumento}:</strong> ${data.numeroDocumento} | <strong>Estado:</strong> ${data.estado} <br>
          <strong>Teléfono:</strong> ${data.telefono} | <strong>Correo:</strong> ${data.correo} <br>
          <strong>Dirección:</strong> ${data.direccion}
        `;
      } catch (err) {
        box.classList.remove("d-none", "alert-success");
        box.classList.add("alert-danger");
        box.innerText = "Error: " + err.message;
      }
    }

    async function consultarAtenciones() {
      const id = document.getElementById("buscarId").value;
      const tabla = document.getElementById("tablaAtenciones");
      const tbody = document.getElementById("cuerpoAtenciones");
      try {
        const res = await fetch(`${API_URL}/${id}/atenciones`);
        const data = await res.json();
        tbody.innerHTML = "";

        if (data.length === 0) {
          alert("El paciente no tiene atenciones registradas.");
          tabla.classList.add("d-none");
          return;
        }

        data.forEach(at => {
          tbody.innerHTML += `
            <tr>
              <td>${at.id}</td>
              <td>${new Date(at.fechaAtencion).toLocaleDateString()}</td>
              <td>${at.especialidad}</td>
              <td>${at.medico}</td>
              <td>${at.motivo}</td>
            </tr>
          `;
        });
        tabla.classList.remove("d-none");
      } catch (err) {
        alert("Error al cargar atenciones: " + err.message);
      }
    }

    async function registrarPaciente(e) {
      e.preventDefault();
      const divMsg = document.getElementById("mensajeRegistro");

      const payload = {
        tipoDocumento: document.getElementById("tipoDocumento").value,
        numeroDocumento: document.getElementById("numeroDocumento").value,
        nombres: document.getElementById("nombres").value,
        apellidoPaterno: document.getElementById("apellidoPaterno").value,
        apellidoMaterno: document.getElementById("apellidoMaterno").value,
        fechaNacimiento: document.getElementById("fechaNacimiento").value,
        sexo: "Masculino",
        telefono: document.getElementById("telefono").value,
        correo: document.getElementById("correo").value,
        direccion: document.getElementById("direccion").value,
        contactos: [
          {
            nombreCompleto: "Familiar Principal",
            parentesco: "Madre",
            telefono: document.getElementById("telefono").value
          }
        ]
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.status === 201) {
          divMsg.innerHTML = `<div class="alert alert-success">Paciente registrado correctamente.</div>`;
          document.getElementById("formPaciente").reset();
        } else {
          const errData = await res.json().catch(() => ({}));
          divMsg.innerHTML = `<div class="alert alert-danger">Error: Documento duplicado o datos inválidos.</div>`;
        }
      } catch (err) {
        divMsg.innerHTML = `<div class="alert alert-danger">Error de conexión con el backend.</div>`;
      }
    }
</script>
</body>
</html>
